<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Diagnóstico de Leitura por IA - Meu Mercado</title>
  <meta name="theme-color" content="#090d16">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      padding-bottom: 60px;
    }
    .diag-container {
      max-width: 680px;
      margin: 0 auto;
    }
    .diag-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .diag-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }
    .back-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .btn-snap {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      color: #ffffff;
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .btn-snap:active {
      transform: scale(0.98);
    }
    .preview-box {
      margin-top: 12px;
      text-align: center;
      display: none;
    }
    .preview-img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      object-fit: contain;
      background: #000;
    }
    .timing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .time-badge {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .time-badge .label {
      font-size: 0.72rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 2px;
    }
    .time-badge .value {
      font-size: 1rem;
      font-weight: 700;
      font-family: monospace;
    }
    .val-fast { color: #34d399; }
    .val-med { color: #facc15; }
    .val-slow { color: #f87171; }

    .json-box {
      background: #030712;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.78rem;
      color: #a5f3fc;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      margin-top: 8px;
    }
    .field-tag {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      font-size: 0.8rem;
      margin: 3px;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-top: 12px;
      display: none;
      word-break: break-all;
      font-family: monospace;
    }
    .step-log {
      font-size: 0.76rem;
      color: #94a3b8;
      font-family: monospace;
      margin-top: 8px;
      line-height: 1.5;
    }
    .step-log span {
      display: block;
    }
    .config-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="diag-container">
    <div class="diag-header">
      <h1 class="diag-title">🔬 Diagnóstico de Leitura (Etapa 1)</h1>
      <a href="./index.html" class="back-btn">← Voltar ao App</a>
    </div>

    <!-- 1. Configurações do Teste -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 0.85rem; font-weight: 700; color: #cbd5e1;">⚙️ Chave da API Gemini</span>
        <button id="btn-save-key" style="background:#0284c7;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:0.75rem;cursor:pointer;">Salvar</button>
      </div>
      <input type="password" id="input-api-key" class="config-input" placeholder="Cole sua chave aqui..." />
      <span id="key-status" style="font-size: 0.72rem; color: #94a3b8; display: block; margin-top: 4px;">Carregando chave salva...</span>

      <div style="display: flex; gap: 8px; margin-top: 10px; align-items: center;">
        <span style="font-size: 0.8rem; color: #94a3b8;">Modelo:</span>
        <select id="select-model" class="config-input" style="width: auto; flex: 1; padding: 6px 10px;">
          <option value="gemini-flash-lite-latest" selected>gemini-flash-lite-latest (Recomendado - 1.500/dia)</option>
          <option value="gemini-flash-latest">gemini-flash-latest</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash (Apenas 20/dia)</option>
        </select>
      </div>
    </div>

    <!-- 2. Botão de Ação -->
    <div class="card" style="text-align: center;">
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none;" />
      <button id="btn-trigger-snap" class="btn-snap">
        <span>📸</span>
        <span>Tirar Foto da Etiqueta para Teste</span>
      </button>

      <div class="preview-box" id="preview-box">
        <img id="preview-img" class="preview-img" alt="Foto capturada" />
        <div id="img-stats" style="font-size: 0.76rem; color: #94a3b8; margin-top: 6px;"></div>
      </div>
    </div>

    <!-- 3. Cronômetro e Tempos das Etapas -->
    <div class="card" id="results-card" style="display: none;">
      <span style="font-size: 0.9rem; font-weight: 700; color: #38bdf8;">⏱️ Tempos Separados por Etapa</span>
      
      <div class="timing-grid">
        <div class="time-badge">
          <span class="label">1. Compressão</span>
          <span class="value" id="time-compression">0 ms</span>
        </div>
        <div class="time-badge">
          <span class="label">2. Envio & Resposta IA</span>
          <span class="value" id="time-network">0 ms</span>
        </div>
        <div class="time-badge">
          <span class="label">3. Parse / Validação</span>
          <span class="value" id="time-parse">0 ms</span>
        </div>
        <div class="time-badge" style="border-color: rgba(56, 189, 248, 0.4);">
          <span class="label">TOTAL DA OPERAÇÃO</span>
          <span class="value" id="time-total" style="color: #38bdf8;">0 ms</span>
        </div>
      </div>

      <div class="step-log" id="step-log"></div>
    </div>

    <!-- 4. Erros Completos (se houver) -->
    <div class="error-box" id="error-box"></div>

    <!-- 5. Dados Extraídos Formatados -->
    <div class="card" id="fields-card" style="display: none;">
      <span style="font-size: 0.9rem; font-weight: 700; color: #34d399;">✓ Campos Identificados</span>
      <div style="margin-top: 8px;" id="fields-container"></div>
    </div>

    <!-- 6. JSON Retornado pela IA -->
    <div class="card" id="json-card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem; font-weight: 700; color: #cbd5e1;">📄 JSON Bruto Retornado</span>
        <button id="btn-copy-json" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #cbd5e1; padding: 3px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer;">Copiar</button>
      </div>
      <pre class="json-box" id="json-content"></pre>
    </div>
  </div>

  <script type="module">
    import { initDB, getConfig, setConfig } from './js/db.js';

    const inputKey = document.getElementById('input-api-key');
    const keyStatus = document.getElementById('key-status');
    const btnSaveKey = document.getElementById('btn-save-key');
    const selectModel = document.getElementById('select-model');
    const fileInput = document.getElementById('file-input');
    const btnTrigger = document.getElementById('btn-trigger-snap');
    const previewBox = document.getElementById('preview-box');
    const previewImg = document.getElementById('preview-img');
    const imgStats = document.getElementById('img-stats');

    const resultsCard = document.getElementById('results-card');
    const timeCompression = document.getElementById('time-compression');
    const timeNetwork = document.getElementById('time-network');
    const timeParse = document.getElementById('time-parse');
    const timeTotal = document.getElementById('time-total');
    const stepLog = document.getElementById('step-log');
    const errorBox = document.getElementById('error-box');

    const fieldsCard = document.getElementById('fields-card');
    const fieldsContainer = document.getElementById('fields-container');
    const jsonCard = document.getElementById('json-card');
    const jsonContent = document.getElementById('json-content');
    const btnCopyJson = document.getElementById('btn-copy-json');

    // Carrega chave existente
    async function loadSavedKey() {
      try {
        await initDB();
        const savedKey = await getConfig('geminiApiKey');
        if (savedKey && savedKey.trim().length > 5) {
          inputKey.value = savedKey;
          keyStatus.textContent = `Chave salva no aparelho: ${savedKey.slice(0, 7)}...${savedKey.slice(-4)}`;
          keyStatus.style.color = '#34d399';
        } else {
          keyStatus.textContent = 'Nenhuma chave configurada ainda.';
          keyStatus.style.color = '#f87171';
        }
      } catch (err) {
        keyStatus.textContent = 'Erro ao ler chave local: ' + err.message;
      }
    }
    loadSavedKey();

    btnSaveKey.addEventListener('click', async () => {
      const k = inputKey.value.trim();
      if (!k) return;
      await setConfig('geminiApiKey', k);
      keyStatus.textContent = '✓ Chave salva com sucesso!';
      keyStatus.style.color = '#34d399';
    });

    btnTrigger.addEventListener('click', () => {
      fileInput.click();
    });

    btnCopyJson.addEventListener('click', () => {
      navigator.clipboard.writeText(jsonContent.textContent).then(() => {
        btnCopyJson.textContent = '✓ Copiado!';
        setTimeout(() => btnCopyJson.textContent = 'Copiar', 1500);
      });
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      // Reseta telas
      errorBox.style.display = 'none';
      errorBox.textContent = '';
      fieldsCard.style.display = 'none';
      jsonCard.style.display = 'none';
      resultsCard.style.display = 'block';
      stepLog.innerHTML = '';
      btnTrigger.disabled = true;
      btnTrigger.textContent = '⏳ Executando diagnóstico...';

      const log = (msg) => {
        const span = document.createElement('span');
        span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        stepLog.appendChild(span);
      };

      const tStartTotal = performance.now();

      try {
        log(`Foto selecionada: ${file.name || 'foto.jpg'} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);

        // ETAPA 1: Compressão
        const tStartCompress = performance.now();
        const compressed = await compressImage(file, 1024, 0.75);
        const tEndCompress = performance.now();
        const dCompress = Math.round(tEndCompress - tStartCompress);

        timeCompression.textContent = `${dCompress} ms`;
        timeCompression.className = 'value ' + (dCompress < 400 ? 'val-fast' : 'val-med');

        previewImg.src = compressed.dataUrl;
        previewBox.style.display = 'block';
        imgStats.textContent = `Original: ${(file.size / 1024).toFixed(0)} KB | Comprimido: ${compressed.width}x${compressed.height} (${(compressed.bytes / 1024).toFixed(1)} KB) [-${Math.round((1 - compressed.bytes / file.size) * 100)}%]`;
        log(`Compressão concluída em ${dCompress}ms (peso: ${(compressed.bytes / 1024).toFixed(1)} KB)`);

        // ETAPA 2: Envio e IA
        const apiKey = inputKey.value.trim();
        if (!apiKey) {
          throw new Error('Chave da API não configurada. Cole sua chave no topo antes de testar.');
        }

        const model = selectModel.value;
        log(`Enviando para modelo ${model}...`);

        const prompt = `Você lê etiquetas de preço de supermercado brasileiro a partir de uma foto. Responda SOMENTE com JSON válido: descricao (nome completo do produto), preco (número em reais), peso_valor (número ou null), peso_unidade ('g','kg','ml','l','un' ou null), preco_por_kg_ou_l (número ou null), codigo_barras (string ou null), confianca ('alta','media','baixa'). Campo ilegível = null. Nunca invente valores.`;

        const payload = {
          contents: [
            {
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: 'image/jpeg',
                    data: compressed.dataUrl.split(',')[1]
                  }
                }
              ]
            }
          ],
          generationConfig: {
            responseMimeType: 'application/json',
            temperature: 0.1,
            thinkingConfig: {
              thinkingBudget: 0
            }
          }
        };

        const tStartNet = performance.now();
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const netCtrl = new AbortController();
        const netTimer = setTimeout(() => netCtrl.abort(), 15000);

        let response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: netCtrl.signal
        });

        // Se o modelo rejeitar thinkingConfig com 400, tenta sem thinkingConfig
        if (response.status === 400 && payload.generationConfig.thinkingConfig) {
          log('Modelo não suporta thinkingBudget, retentando sem thinkingConfig...');
          delete payload.generationConfig.thinkingConfig;
          response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: netCtrl.signal
          });
        }
        clearTimeout(netTimer);

        const tEndNet = performance.now();
        const dNet = Math.round(tEndNet - tStartNet);
        timeNetwork.textContent = `${dNet} ms`;
        timeNetwork.className = 'value ' + (dNet < 3000 ? 'val-fast' : (dNet < 6000 ? 'val-med' : 'val-slow'));
        log(`Resposta HTTP ${response.status} ${response.statusText} recebida em ${dNet}ms`);

        if (!response.ok) {
          const errText = await response.text();
          let errDetail = errText;
          try {
            const errObj = JSON.parse(errText);
            errDetail = JSON.stringify(errObj, null, 2);
          } catch(e) {}
          throw new Error(`HTTP ${response.status} (${response.statusText}):\n${errDetail}`);
        }

        const data = await response.json();

        // ETAPA 3: Parse e Validação
        const tStartParse = performance.now();
        const textContent = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!textContent) {
          throw new Error('A resposta do Gemini não continha parts[0].text:\n' + JSON.stringify(data, null, 2));
        }

        let parsed = null;
        try {
          parsed = JSON.parse(textContent);
        } catch (jsonErr) {
          const match = textContent.match(/\{[\s\S]*\}/);
          if (match) parsed = JSON.parse(match[0]);
          else throw new Error('Não foi possível fazer parse do JSON retornado:\n' + textContent);
        }

        const tEndParse = performance.now();
        const dParse = Math.round(tEndParse - tStartParse);
        timeParse.textContent = `${dParse} ms`;
        timeParse.className = 'value val-fast';

        const tEndTotal = performance.now();
        const dTotal = Math.round(tEndTotal - tStartTotal);
        timeTotal.textContent = `${dTotal} ms (${(dTotal / 1000).toFixed(2)}s)`;
        timeTotal.className = 'value ' + (dTotal < 3500 ? 'val-fast' : (dTotal < 7000 ? 'val-med' : 'val-slow'));
        log(`Processamento concluído com sucesso em ${dTotal}ms!`);

        // Exibe JSON
        jsonContent.textContent = JSON.stringify(parsed, null, 2);
        jsonCard.style.display = 'block';

        // Exibe Campos Formatados
        renderFields(parsed);
        fieldsCard.style.display = 'block';

      } catch (err) {
        log(`❌ ERRO: ${err.message}`);
        errorBox.textContent = `FALHA DETECTADA:\n${err.message}`;
        errorBox.style.display = 'block';
        const tEndTotal = performance.now();
        timeTotal.textContent = `${Math.round(tEndTotal - tStartTotal)} ms (Falha)`;
        timeTotal.className = 'value val-slow';
      } finally {
        btnTrigger.disabled = false;
        btnTrigger.innerHTML = '<span>📸</span><span>Tirar Outra Foto para Teste</span>';
      }
    });

    function renderFields(p) {
      fieldsContainer.innerHTML = `
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <span class="field-tag"><strong>Descrição:</strong> ${p.descricao || '<span style="color:#ef4444">null</span>'}</span>
          <span class="field-tag" style="background:rgba(52,211,153,0.15); border-color:#34d399;"><strong>Preço:</strong> R$ ${p.preco !== null && p.preco !== undefined ? Number(p.preco).toFixed(2) : '<span style="color:#ef4444">null</span>'}</span>
          <span class="field-tag"><strong>Peso:</strong> ${p.peso_valor || 'null'} ${p.peso_unidade || ''}</span>
          <span class="field-tag"><strong>Por kg/L:</strong> ${p.preco_por_kg_ou_l || 'null'}</span>
          <span class="field-tag"><strong>Código de Barras:</strong> ${p.codigo_barras || 'null'}</span>
          <span class="field-tag" style="background:${p.confianca === 'alta' ? 'rgba(52,211,153,0.2)' : 'rgba(250,204,21,0.2)'}; border-color:${p.confianca === 'alta' ? '#34d399' : '#facc15'};"><strong>Confiança:</strong> ${p.confianca || 'null'}</span>
        </div>
      `;
    }

    function compressImage(file, maxDimension = 1024, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const head = 'data:image/jpeg;base64,';
            const bytes = Math.round((dataUrl.length - head.length) * 3 / 4);
            resolve({ dataUrl, width, height, bytes });
          };
          img.onerror = () => reject(new Error('Erro ao decodificar arquivo de imagem'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Erro ao ler arquivo da câmera'));
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
