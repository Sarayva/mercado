<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meu Mercado - Compras & Preços</title>

  <!-- PWA Meta Tags & Cores de Tema -->
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mercado">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="App PWA para controle de compras no supermercado com total ao vivo e histórico de preços.">

  <!-- Favicon e Manifest -->
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">

  <!-- Estilos Unificados (Carga instantânea em 1 requisição) -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <!-- HEADER FIXO SLIM NO TOPO -->
    <header class="sticky-header">
      <div class="header-inner">
        <!-- Linha 1: Lista Ativa + Seletor de Modo Compacto -->
        <div class="header-top-row">
          <button id="header-list-select-btn" class="list-chip-btn" title="Trocar ou criar lista">
            <span>📋</span>
            <span id="header-list-name" class="chip-label">Carregando...</span>
            <span class="chip-arrow">▼</span>
          </button>

          <!-- Segmented Control de Modos (Sempre visível no topo com 1 toque) -->
          <div class="segmented-control">
            <button id="tab-mode-comprando" class="segmented-btn active">
              🛒 Comprando
            </button>
            <button id="tab-mode-planejando" class="segmented-btn">
              📝 Lista
            </button>
          </div>
        </div>

        <!-- Linha 2: Dashboard Slim de Totais -->
        <div class="header-totals-row">
          <div class="live-total-col">
            <span class="live-badge-label">
              <span class="live-dot"></span> NO CARRINHO
            </span>
            <div class="live-total-number" id="header-total-live">R$ 0,00</div>
          </div>

          <div class="summary-col">
            <div class="summary-top-line">
              <span id="header-estimated-value" class="est-amount">Est: R$ 0,00</span>
              <span id="header-diff-badge" class="diff-tag neutral">Estimativa</span>
            </div>
            <div class="summary-bottom-line">
              <span id="header-progress-text">0 de 0 pegos (0%)</span>
              <button id="sync-status-btn" class="sync-badge sync-offline" title="Status de sincronização (toque para detalhes)" type="button">
                <span class="sync-dot"></span>
                <span id="sync-status-text">offline</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Linha 3: Barra de Progresso Fina na borda inferior do Header -->
      <div class="header-progress-track">
        <div class="header-progress-fill" id="header-progress-fill"></div>
      </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (LISTA DE PRODUTOS) -->
    <main class="main-content">
      <div id="list-content-container"></div>
    </main>

    <!-- BOTÕES FLUTUANTES INFERIORES (FOTO DA ETIQUETA + NOVO ITEM) -->
    <div class="floating-bottom-bar">
      <button id="btn-camera-bottom" class="btn-floating-action btn-camera-action" title="Tirar foto da etiqueta com IA">
        <span style="font-size: 1.15rem; line-height: 1;">📷</span>
        <span>Foto Etiqueta</span>
      </button>

      <button id="btn-add-item-bottom" class="btn-floating-action btn-manual-action" title="Adicionar item manualmente">
        <span style="font-size: 1.25rem; line-height: 1;">+</span>
        <span>Item</span>
      </button>
    </div>

    <!-- CONTAINER DE NOTIFICAÇÕES (TOAST COM "DESFAZER") -->
    <div id="toast-container" class="toast-container"></div>

    <!-- CONTAINER PARA MODAIS E BOTTOM SHEETS -->
    <div id="modal-container"></div>
  </div>

  <!-- SCRIPT PRINCIPAL VIA ES MODULES -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
